### model
model_name_or_path: ~/LLM/Qwen3-VL-2B-Instruct
template: qwen3_vl_nothink

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
dataset: train_data
dataset_dir: train_data
cutoff_len: 16000
output_dir: Qwen3-VL-2B-Instruct-sft

# Training hyperparameters
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-5
num_train_epochs: 2
lr_scheduler_type: cosine
bf16: true
pure_bf16: true
packing: true
ddp_timeout: 1800000000

# Logging + save
logging_steps: 1
save_strategy: epoch
save_total_limit: 30
plot_loss: true

# Others
val_size: 0
report_to: none
dataloader_num_workers: 2